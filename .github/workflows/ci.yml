name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, tests and mobile audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Version bump (shipped files changed, so package.json version must increase)
        if: github.event_name == 'pull_request'
        run: node .github/scripts/check-version.mjs "${{ github.event.pull_request.base.sha }}"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (loader, engine, graph, skill examples)
        run: npm test

      - name: Mobile audit (client code uses React Native primitives only)
        run: |
          if grep -rnE '(document|window|navigator)\.|localStorage|className=|onClick=|<(div|span|button|p|a|img|input|ul|li|h[1-6])[ >/]' client/; then
            echo "::error::client/ must use React Native primitives only (see the plugin docs: Works on mobile)"
            exit 1
          fi
