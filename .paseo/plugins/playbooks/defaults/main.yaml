# Local test setup: cheap step agents, a stronger manager.
tiers:
  cheap:
    - { provider: claude, model: claude-haiku-5-5, mode: default }
    - { provider: codex, model: gpt-5-mini }
  worker: { provider: claude, model: claude-sonnet-5-5 }
providers:
  exhausted_for: 1h            # retry an exhausted provider/model after this long (default 1h)
agent:
  tier: cheap                  # its claude entry runs in mode default: read-only roles read files without permission prompts
manager:
  tier: worker
  mode: default
  compact: { above_tokens: 150000 }   # /compact the manager when idle and over this many tokens
# The warden: one periodic, deterministic pass over the active runs (no LLM, no message to an agent). OFF by default.
warden: { enabled: false }
# warden:                      # defaults shown; set enabled: true to turn it on
#   enabled: false
#   interval: 15m              # how often a run is looked at
#   cooldown: 1h               # a finding that is still true is reported again after this
#   checks:                    # action: report | none (stale_definition also: refresh_scripts, isolated runs only)
#     stale_definition: { action: report }   # the run is pinned to an older definition than origin/<base>
#     manager_blocked: { action: report }    # its manager is gone, or idle while a gate it holds is open
#     loops: { above: 5, action: report }    # a goto edge fired more than this
#     slow: { action: report }               # a running step is slower than its baseline
#     gate_open: { after: 30m, action: report }
