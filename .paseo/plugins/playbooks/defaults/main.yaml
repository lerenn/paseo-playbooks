# Local test setup: cheap step agents, a stronger manager.
tiers:
  cheap:
    - { provider: claude, model: claude-haiku-5-5, mode: default }
    - { provider: codex, model: gpt-5-mini }
  worker: { provider: claude, model: claude-sonnet-5-5 }
providers:
  exhausted_for: 1h            # retry an exhausted provider/model after this long (default 1h)
agent:
  tier: cheap                  # its claude entry runs in mode default: read-only roles read files without permission prompts
manager:
  tier: worker
  mode: default
  compact: { above_tokens: 150000 }   # /compact the manager when idle and over this many tokens
