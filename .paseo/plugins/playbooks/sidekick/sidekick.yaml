# The Sidekick of this repository (lerenn/paseo-playbooks): a coordinator that reads and delegates.
sidekick:
  provider: claude
  # Same model as the playbook managers (defaults/main.yaml). The Sidekick reads runs and sends
  # subagents to do the work, so it does not need a larger one.
  model: claude-sonnet-5-5
  # Ask before acting, as the managers do. It has no shell or file tools anyway.
  mode: default
  # Triage of a failed run or a gate is short reasoning; keep it cheap.
  thinking: medium
  # The three escalation events: a gate nobody answered, a failed run, a lost manager.
  watch: [gate.escalated, run.failed, run.manager_lost]
