# Repo-wide agent defaults. Precedence: step > role > playbook > these > the manager's own.
# Switching provider is one edit here: change the tiers, every `agent: { tier: … }` follows.
tiers:
  cheap:                       # a list: when claude is out of tokens, the step moves to the next entry
    - { provider: claude, model: claude-haiku-5-5 }
    - { provider: codex, model: gpt-5-mini }
  worker: { provider: claude, model: claude-opus-5-5 }
  advisor: { provider: claude, model: claude-opus-5-5, thinking: high }
providers:
  exhausted_for: 1h            # an exhausted provider/model is skipped this long, then tried again (default 1h)
  fallback: [claude/claude-opus-5-5]  # every step falls back to these, after its tier's own entries
  usage: { check: true, threshold: 100 }  # skip a provider whose reported usage is full before starting on it (defaults shown)
agent:
  tier: worker
  mode: bypassPermissions      # steps run unattended (shell commands included)
manager:
  mode: default                # the manager never edits files
  compact: { above_tokens: 150000 }   # never | on_step | on_gate_decided | { above_tokens: N }
  # nudge: { enabled: true, after: 3m, max_interval: 30m }   # prompt an idle manager that leaves a reported step waiting (defaults shown)
# isolation: worktree          # every run works in its own git worktree, so runs can share a workspace
# reload_stale_sessions: false   # default true: after a plugin update, reload idle agents' sessions that hold the old tools
# permissions: { on_request: authorize }   # what the plugin does when a run agent raises a tool permission request: authorize (default) | escalate (a gate) | deny
# The warden: one periodic, deterministic pass over the active runs (no LLM, no message to an agent). OFF by default.
warden: { enabled: false }
# warden:                      # defaults shown; set enabled: true to turn it on
#   enabled: false
#   interval: 15m              # how often a run is looked at
#   cooldown: 1h               # a finding that is still true is reported again after this
#   checks:                    # action: report | none (stale_definition also: refresh_scripts, isolated runs only)
#     stale_definition: { action: report }   # the run is pinned to an older definition than origin/<base>
#     manager_blocked: { action: report }    # its manager is gone, or idle while a gate it holds is open
#     loops: { above: 5, action: report }    # a goto edge fired more than this
#     slow: { action: report }               # a running step is slower than its baseline
#     gate_open: { after: 30m, action: report }
