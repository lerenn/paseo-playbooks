title: Pull request
description: Investigate a request, implement it, open a PR and babysit it until it is green.

inputs:
  request:
    type: string
    required: true
    description: What to change
  base_branch:
    type: string
    default: main
    description: Branch the PR targets

outputs:
  pr_url: { type: string }     # auto-matched from the implement step
  pr_number:
    type: number
    value: "{{ steps.implement.outputs.pr_number }}"

steps:
  - id: investigate
    role: investigator
    inputs: [request]
    outputs:
      plan: { type: string, description: Implementation plan }
    prompt: |
      Request: {{ inputs.request }}

  - id: implement
    role: implementer
    needs: [investigate]
    inputs: [request, plan, base_branch]
    outputs:
      pr_url: { type: string }
      pr_number: { type: number }
      branch: { type: string }
    retries: 1
    timeout: 1h
    prompt: |
      Request: {{ inputs.request }}

      Plan:
      {{ inputs.plan }}

      Open (or update) the pull request against {{ inputs.base_branch }}.

  - id: review
    role: reviewer
    needs: [implement]
    inputs: [pr_url]
    outputs:
      findings: { type: string }
    prompt: "Review the pull request {{ inputs.pr_url }}."

  - id: local_qa
    role: local_qa
    needs: [implement]
    inputs: [branch]
    outputs:
      report: { type: string }
      tests_passed: { type: boolean }
    prompt: "Test the branch {{ inputs.branch }}."

  - id: babysit
    role: babysitter
    needs: [review, local_qa]
    inputs:
      pr_url: ~
      review: "{{ steps.review.outputs.findings }}"
      qa: "{{ steps.local_qa.outputs.report }}"
    outcomes: [ready, changes_requested]
    timeout: 2h
    prompt: |
      Pull request: {{ inputs.pr_url }}

      Review findings:
      {{ inputs.review }}

      Local QA report:
      {{ inputs.qa }}
    on:
      changes_requested: { goto: implement, max_loops: 3 }
