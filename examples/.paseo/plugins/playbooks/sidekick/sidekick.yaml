# This project's Sidekick: a coordinator agent beside the Playbooks screen. Every field is optional.
sidekick:
  mode: plan
  # Events it is told about, for this project's runs.
  watch: [gate.escalated, run.failed, run.manager_lost]
  # Subagents it creates for jobs, and the context size that restarts it with a hand-off summary.
  # subagents: { provider: claude, model: claude-sonnet-5-5, mode: acceptEdits }
  # session: { restart_above_tokens: 300000 }
  # runs: { max_concurrent: 5, confirm_bulk: true }   # rules for the runs it starts (prompt only); default: unlimited, no confirmation
