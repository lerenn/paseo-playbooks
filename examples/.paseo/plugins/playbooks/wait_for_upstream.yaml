title: Wait for upstream
description: Wait until another pipeline has settled a job at a stage, woken by its job events (with a slow poll as the safety net), then announce it.

inputs:
  job:
    type: string
    required: true
    description: The job to wait for

steps:
  - id: wait_settled
    # The script is rerun every 10 minutes while it says "not yet" (exit 75), and at once when the pipeline
    # `upstream` advances or settles a job at its `production` stage.
    script:
      run: check_upstream.sh
      poll: 10m
      wake_on:
        - { types: [job.advanced, job.settled], filter: { playbook: upstream, stage: production } }
    timeout: 6h
    inputs: [job]
    outputs: { outcome_seen: {} }

  - id: announce
    needs: [wait_settled]
    role: { name: reviewer, prompt: "The job {{ inputs.job }} settled upstream ({{ inputs.outcome_seen }}). Say so in one line." }
    inputs: [job, outcome_seen]
